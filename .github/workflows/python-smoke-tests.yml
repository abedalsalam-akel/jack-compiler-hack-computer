name: Compiler and VM translator smoke tests

on:
  push:
  pull_request:

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python source syntax
        run: python -m compileall -q project07 project08 project10 project11 tests
      - name: Run compiler and translator tests
        run: python -m unittest discover -s tests -v
